          <div class="compose-actions"><button class="btn btn-primary" id="sendBtn">发送</button><button class="btn" id="draftBtn">保存草稿</button><button class="btn" id="scheduleBtn">${icon('i-clock')}定时发送</button><button class="btn-link" id="cancelCompose">取消</button><div class="right-tools"><span class="switch" id="importantSwitch"></span><span>重要邮件</span></div></div>
        </div>`;
      mainView.querySelectorAll('.choose-people').forEach(b=>b.addEventListener('click',()=>openPeople(b.dataset.type)));
      const composeMail = () => {
        const replyOriginal = composeContext?.kind==='reply' ? composeContext.originalMail : null;
        return {to:editingMail.to || '李四、王五、赵六等45人', subject:document.getElementById('subjectInput').value.trim() || '无主题', summary:document.getElementById('editorArea').innerText.trim() || '（无正文）', attachment:true, time:nowText(), readCount:0, unreadCount:45, recalledCount:0, starred:false, ...(replyOriginal ? {replyOriginal} : {})};
      };
      const removeComposeSource = () => { if (composeContext?.kind==='drafts') drafts.splice(composeContext.index,1); if (composeContext?.kind==='pending') pending.splice(composeContext.index,1); composeContext=null; };
      document.getElementById('sendBtn').addEventListener('click',()=>{ pendingSendMail=composeMail(); document.getElementById('confirmSubject').textContent=pendingSendMail.subject; openModal('confirmModal'); });
      document.getElementById('draftBtn').addEventListener('click',()=>{ const saved={...composeMail(), time:nowText()}; delete saved.readCount; delete saved.unreadCount; delete saved.recalledCount; if(composeContext?.kind==='drafts') drafts[composeContext.index]=saved; else { removeComposeSource(); drafts.unshift(saved); } composeContext={kind:'drafts',index:0}; updateCounts(); showToast('草稿已保存'); });
      document.getElementById('scheduleBtn').addEventListener('click',()=>{ const defaultTime=new Date(Date.now()+10*60000).toISOString().slice(0,16); openSimpleDialog('定时发送',`<div class="field"><label>计划发送时间（至少晚于当前时间5分钟）</label><input id="scheduleTime" type="datetime-local" value="${defaultTime}" style="width:100%;height:40px;border:1px solid #cfdbe8;padding:0 10px"></div>`,{onConfirm:()=>{const value=document.getElementById('scheduleTime').value; if(!value || new Date(value).getTime()<Date.now()+5*60000){showToast('计划发送时间需晚于当前时间5分钟');return;} const scheduled={...composeMail(),scheduleAt:value.replace('T',' ')}; delete scheduled.time; delete scheduled.readCount; delete scheduled.unreadCount; delete scheduled.recalledCount; removeComposeSource(); pending.unshift(scheduled); updateCounts(); renderSpecialList('pending'); setActive('pending'); showToast('邮件已加入待发送');}});});
      document.getElementById('cancelCompose').addEventListener('click',()=>openSimpleDialog('离开写邮件','<p>当前邮件有未保存内容，请选择保存草稿并离开，或返回继续编辑。</p>'));
      document.getElementById('importantBtn').addEventListener('click',()=>document.getElementById('importantSwitch').classList.toggle('on'));
      document.getElementById('importantSwitch').addEventListener('click',e=>e.currentTarget.classList.toggle('on'));
      document.getElementById('insertImage').addEventListener('click',()=>showToast('可选择插入正文或作为附件'));
    }

    function renderDetail(mail, isSent=false, sentIndex=-1, isTrash=false, returnView='inbox') {
      currentView='detail';
      const sourceName = isTrash ? '回收站' : isSent ? '已发送' : '收件箱';
      const isRecalled = Boolean(mail.recalled);
      const starControl = isRecalled ? '' : isTrash
        ? (mail.starred ? `<span class="readonly-star" title="来源：星标邮件（只读）" aria-label="来源：星标邮件（只读）">${starIcon(true)}</span>` : '')
        : `<button class="btn star-detail-button" id="detailStar" title="${mail.starred?'取消星标':'标记为星标邮件'}" aria-label="${mail.starred?'取消星标':'标记为星标邮件'}" aria-pressed="${Boolean(mail.starred)}">${starIcon(Boolean(mail.starred))}</button>`;
      const detailBody = isRecalled
        ? `<div class="recalled-detail"><div><div class="recalled-detail-icon">▣</div><strong>该邮件已被发件人撤回</strong><p>正文及附件不可查看。</p><p style="font-size:13px;color:#8493a3">系统已保留撤回提示记录，不包含原邮件主题或内容。</p></div></div>`
        : mail.approval
        ? `<div class="detail-body"><p>${mail.approvalTime}，${mail.projectName}发起“${mail.approvalFlow}”审批流，请审批。</p><div class="signature">企业流程中心<br>${mail.approvalTime.slice(0, 10)}</div></div>`
        : mail.replyOriginal
          ? `<div class="detail-body"><p>${mail.summary}</p><div class="signature">${mail.sender || '张建军'}<br>${mail.time}</div></div>`
        : `<div class="detail-body"><p>各部门、各单位：</p><p>　　为进一步落实公司2026年度经营管理目标，做好第三季度重点工作安排，确保年度目标任务按期完成，现将《2026年第三季度工作计划》印发给你们，请结合实际认真贯彻执行。有关要求如下：</p><p>　　一、请各单位高度重视，细化工作举措，明确责任分工，确保各项任务落实到位。</p><p>　　二、请于9月25日前将本单位贯彻落实情况及重点工作安排报送至公司办公室。</p><p>　　三、公司将适时组织开展第三季度工作推进情况检查，具体安排另行通知。</p><div class="signature">中国建筑集团有限公司<br>2026年9月15日</div></div>`;
      const originalMessage = mail.replyOriginal ? `<section class="original-message" aria-label="原邮件"><button class="original-toggle" id="originalToggle" aria-expanded="false"><span>原邮件</span><span class="original-subject">${mail.replyOriginal.subject}</span><span class="toggle-text">展开⌄</span></button><div class="original-content" id="originalContent" hidden><div class="original-meta">发件人：${mail.replyOriginal.sender}　｜　发送时间：${mail.replyOriginal.time}</div><div>${mail.replyOriginal.body}</div>${mail.replyOriginal.attachmentCount ? `<div class="original-files">原邮件附件（${mail.replyOriginal.attachmentCount}）<button class="btn-link" id="viewOriginalAttachments">查看原邮件附件</button></div>` : ''}</div></section>` : '';
      const detailExtras = isRecalled || mail.approval ? '' : `${originalMessage}${mail.attachment ? `<div class="section-box"><div class="section-head"><span>附件（2个）</span><button class="btn-link">全部下载</button></div><div class="attachment-cards"><div class="attachment-card"><span class="file-icon pdf">PDF</span><div class="file-info">第三季度工作计划.pdf<small>2.35 MB</small></div><button class="btn-link">预览</button><button class="btn-link">下载</button></div><div class="attachment-card"><span class="file-icon xls">XLS</span><div class="file-info">重点任务分解表.xlsx<small>1.08 MB</small></div><button class="btn-link">预览</button><button class="btn-link">下载</button></div></div></div>` : ''}`;
      mainView.innerHTML = `
        <div class="content-header"><div class="page-title">邮件详情</div><div class="mail-total">来源：${sourceName}</div></div>
        <div class="detail">
          <div class="detail-actions"><button class="btn-link" id="backList">‹ 返回${returnView==='starred'?'星标邮件':sourceName}</button><div class="action-group">${isRecalled?'':isSent?`<button class="btn btn-danger" id="recallDetail" ${mail.unreadCount?'':'disabled'}>${mail.recalledCount?'已撤回':mail.unreadCount?'撤回邮件':'不可撤回'}</button><button class="btn action-compose" data-mode="forward" data-prefix="转发：">${icon('i-forward')}转发</button>`:`<button class="btn btn-primary action-compose" data-mode="reply" data-prefix="回复：">${icon('i-reply')}回复</button><button class="btn action-compose" data-mode="reply" data-prefix="回复：">${icon('i-reply')}回复全部</button><button class="btn action-compose" data-mode="forward" data-prefix="转发：">${icon('i-forward')}转发</button>`}${starControl}${isRecalled?'':`<button class="btn detail-more" id="moreBtn"><span>更多</span><svg class="icon more-chevron" aria-hidden="true"><use href="#i-chevron"/></svg></button>`}</div></div>
          <div class="mail-heading"><h2>${isRecalled?'邮件已撤回':mail.subject}</h2></div>
          ${isRecalled ? `<dl class="mail-meta"><dt>发件人：</dt><dd>${mail.sender}</dd><dt>撤回时间：</dt><dd>${mail.time}</dd></dl>` : `<dl class="mail-meta"><dt>发件人：</dt><dd>${mail.sender || '张建军'} &lt;${mail.senderEmail || 'wangjg@ccec.com'}&gt;</dd><dt>收件人：</dt><dd>${isSent?mail.to:'李四、王五、赵六等45人'}　<button class="btn-link people-detail">查看详情</button></dd><dt>抄送人：</dt><dd>钱七、周八等12人　<button class="btn-link people-detail">查看详情</button></dd><dt>发送时间：</dt><dd>${mail.time || '2026-09-15 09:30'}</dd>${isSent?`<dt>送达状态：</dt><dd><span class="recall-status">${sentReadSummary(mail)}</span></dd>`:''}</dl>`}
          ${detailBody}
          ${detailExtras}
        </div>`;
      document.getElementById('backList').addEventListener('click',()=>renderList(isTrash?'trash':returnView));
      document.getElementById('recallDetail')?.addEventListener('click',()=>openRecall(sentIndex, true, returnView));
      mainView.querySelectorAll('.action-compose').forEach(b=>b.addEventListener('click',()=>{
        const isReply=b.dataset.mode==='reply';
        const originalMail={subject:mail.subject.replace(/^(回复：|转发：)/,''), sender:mail.sender || '张建军', time:mail.time || nowText(), body:mail.summary || '', attachmentCount:mail.attachment ? 2 : 0};
        renderCompose({to:isReply ? (mail.sender || '张建军') : '', subject:b.dataset.prefix+originalMail.subject, summary:'', attachment:false}, isReply ? {kind:'reply', originalMail} : {kind:'forward', originalMail});
      }));
      mainView.querySelectorAll('.people-detail').forEach(b=>b.addEventListener('click',()=>openPeople('detail')));
      document.getElementById('detailStar')?.addEventListener('click',e=>{
        mail.starred = !mail.starred;
        if (mail.starred && !isSent) mail.unread = false;
        updateCounts();
        e.currentTarget.innerHTML = starIcon(mail.starred);
        e.currentTarget.setAttribute('aria-pressed', String(mail.starred));
        e.currentTarget.setAttribute('aria-label', mail.starred?'取消星标':'标记星标');
        showToast(mail.starred?'已标记为星标邮件':'已取消星标邮件');
      });
      const bindMoreActions=()=>{
        document.getElementById('markUnreadDetail')?.addEventListener('click',()=>{mail.unread=true; updateCounts(); closeModal('simpleModal'); showToast('已标记为未读');});
        document.getElementById('copyDetail')?.addEventListener('click',()=>{closeModal('simpleModal'); showToast('邮件内容已复制');});
        document.getElementById('deleteDetail')?.addEventListener('click',()=>{closeModal('simpleModal'); openSimpleDialog('删除邮件', `<p>确定将“${mail.subject}”移入回收站吗？</p>`, {danger:true,confirmText:'确认删除',onConfirm:()=>{ const kind=isSent?'sent':'inbox'; const index=isSent?sentIndex:emails.findIndex(x=>x===mail); if(index>=0)moveToTrash(kind,index); renderList(returnView==='starred'?'starred':kind); showToast('邮件已移入回收站'); }});});
      };
      document.getElementById('moreBtn')?.addEventListener('click',()=>openSimpleDialog('更多操作',`<div style="display:grid;gap:10px">${isSent||isTrash?'':'<button class="btn" id="markUnreadDetail">标记为未读</button>'}<button class="btn" id="copyDetail">复制邮件内容</button>${isTrash?'':'<button class="btn btn-danger" id="deleteDetail">删除到回收站</button>'}</div>`,{confirmText:'关闭',onConfirm:()=>{}}));
      document.getElementById('moreBtn')?.addEventListener('click',()=>setTimeout(bindMoreActions,0));
      document.getElementById('originalToggle')?.addEventListener('click',e=>{const open=e.currentTarget.getAttribute('aria-expanded')==='true'; e.currentTarget.setAttribute('aria-expanded',String(!open)); document.getElementById('originalContent').hidden=open; e.currentTarget.querySelector('.toggle-text').textContent=open?'展开⌄':'收起⌃';});
      document.getElementById('viewOriginalAttachments')?.addEventListener('click',()=>showToast('已定位到原邮件附件，可按权限查看或下载'));
    }

    function openPeople(type) {
      currentPersonType=type; document.getElementById('peopleTitle').textContent = type==='cc'?'选择抄送人':type==='detail'?'人员明细':'选择收件人';
      document.getElementById('peopleConfirm').textContent = type==='detail'?'关闭':'确定'; openModal('peopleModal');
    }
    function handleAction(action, index=-1) {
      if (action==='edit-pending') renderCompose(pending[index], {kind:'pending',index});
      if (action==='send-now') { pendingSendMail={...pending[index], time:nowText(), readCount:0, unreadCount:45, recalledCount:0}; delete pendingSendMail.scheduleAt; composeContext={kind:'pending',index}; document.getElementById('confirmSubject').textContent=pendingSendMail.subject; openModal('confirmModal'); }
      if (action==='restore') { const source=trashMails[index]?.source || '原来源模块'; restoreFromTrash(index); renderSpecialList('trash'); showToast(`邮件已恢复到${source}`); }
      if (action==='purge') openSimpleDialog('彻底删除','<p>彻底删除后无法恢复，是否继续？</p>',{danger:true,confirmText:'确认删除',onConfirm:()=>{trashMails.splice(index,1); renderSpecialList('trash'); showToast('邮件已彻底删除');}});
      if (action==='cancel-schedule') openSimpleDialog('取消定时发送','<p>取消定时后，该邮件将转为普通草稿。</p>',{confirmText:'确认取消',onConfirm:()=>{const [mail]=pending.splice(index,1); if(mail){delete mail.scheduleAt; mail.time=nowText(); drafts.unshift(mail);} updateCounts(); renderSpecialList('pending'); showToast('已取消定时，邮件已转入草稿箱');}});
      if (action==='recall') openRecall(index);
    }

    function showPortal(initial=false) {
      portalDashboard.classList.remove('is-hidden');
      emailApp.classList.add('is-hidden');
      portalTab.classList.add('active-sub');
      mailTab.classList.remove('active-sub');
      if (initial && !mailOpened) mailTab.classList.add('is-hidden');
    }

    function showMail(view) {
      mailOpened = true;
      portalDashboard.classList.add('is-hidden');
      emailApp.classList.remove('is-hidden');
      portalTab.classList.remove('active-sub');
      mailTab.classList.remove('is-hidden');
      mailTab.classList.add('active-sub');
      if (view) renderList(view);
    }

    function closeMailTab() {
      mailOpened = false;
      showPortal(true);
    }

    document.getElementById('sideMenu').addEventListener('click', e=>{ const b=e.target.closest('[data-view]'); if(!b)return; b.dataset.view==='compose'?renderCompose():renderList(b.dataset.view); });
    document.getElementById('topMail').addEventListener('click',()=>showMail('inbox'));
    portalTab.addEventListener('click',()=>showPortal(false));
    document.getElementById('mailTabOpen').addEventListener('click',()=>showMail());
    document.getElementById('mailTabClose').addEventListener('click',closeMailTab);
    document.getElementById('myMailTitle').addEventListener('click',()=>showMail('inbox'));
    document.getElementById('myMailMore').addEventListener('click',()=>showMail('inbox'));
    document.querySelectorAll('[data-portal-mail]').forEach(row=>row.addEventListener('click',()=>{
      const mail = emails.find(x=>x.id===Number(row.dataset.portalMail));
      showMail();
      mail.unread = false;
      updateCounts();
      renderDetail(mail);
    }));
    document.querySelectorAll('[data-close]').forEach(b=>b.addEventListener('click',()=>closeModal(b.dataset.close)));
    document.querySelectorAll('.modal-layer').forEach(layer=>layer.addEventListener('click',e=>{if(e.target===layer)closeModal(layer.id)}));
    document.getElementById('peopleConfirm').addEventListener('click',()=>{closeModal('peopleModal'); if(currentPersonType!=='detail')showToast(currentPersonType==='cc'?'抄送人已更新':'收件人已更新');});
    document.getElementById('peopleSearch').addEventListener('input',e=>{const k=e.target.value.trim(); document.querySelectorAll('#peopleRows tr').forEach(r=>r.style.display=!k||r.dataset.key.includes(k)?'':'none');});
    document.getElementById('confirmSend').addEventListener('click',()=>{
      if (!pendingSendMail) { closeModal('confirmModal'); return; }
      if (composeContext?.kind==='drafts') drafts.splice(composeContext.index,1);
      if (composeContext?.kind==='pending') pending.splice(composeContext.index,1);
      sent.unshift(pendingSendMail);
      pendingSendMail=null; composeContext=null;
      updateCounts();
      closeModal('confirmModal'); renderSpecialList('sent'); setActive('sent'); showToast('邮件已成功发送');
    });
    document.getElementById('simpleConfirm').addEventListener('click',()=>{const action=simpleConfirmAction; closeModal('simpleModal'); simpleConfirmAction=null; if(action)action(); else showToast('操作已完成');});
    document.addEventListener('keydown',e=>{if(e.key==='Escape')document.querySelectorAll('.modal-layer.open').forEach(x=>x.classList.remove('open'));});
    updateCounts();
    renderList('inbox');
    showPortal(true);
  </script>
</body>
</html>
